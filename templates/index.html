<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Health Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn {
      padding: 12px 25px;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
      display: inline-block;
    }
    .btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Do you want to check your heart health?</h2>
    <a href="{{ url_for('form') }}" class="btn">Yes</a>
    <a href="#" class="btn" onclick="alert('Okay, stay healthy!')">No</a>
  </div>
</body>
</html>
